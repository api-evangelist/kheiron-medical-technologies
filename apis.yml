name: Kheiron Medical Technologies
description: >-
  Kheiron Medical Technologies is a London-founded medical-imaging AI company best
  known for Mia (Mammography Intelligent Assessment), a deep-learning solution that
  supports radiologists in breast-cancer screening as an independent, concurrent, or
  triage reader. Founded in 2016 and backed by investors including Atomico, Kheiron
  now operates as part of RadNet's DeepHealth, whose portfolio spans breast, prostate,
  lung, brain, and thyroid imaging plus the Diagnostic, Operations, and TechLive
  suites. This API Evangelist profile tracks Kheiron/DeepHealth as a health-AI provider;
  the company exposes clinical products and enterprise integrations rather than a
  public self-serve developer API, so most machine-readable API artifacts are not
  applicable and this record captures its identity, security, and legal surface.
